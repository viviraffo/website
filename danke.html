<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank | Raffo Büroservice</title>
  
  <!-- Falls vorhanden: Dein globales Stylesheet einbinden -->
  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) - Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3H9G75GCH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-F3H9G75GCH');
  </script>

  <style>
    .thank-you-container {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      font-family: inherit;
    }

    .thank-you-card {
      background: #ffffff;
      max-width: 550px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .thank-you-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .thank-you-card h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #333333;
    }

    .thank-you-card p {
      font-size: 16px;
      line-height: 1.6;
      color: #666666;
      margin-bottom: 30px;
    }

    /* Rosa / Pink gestylter Button & Link */
    .btn-rosa {
      display: inline-block;
      background-color: #e84393; /* Elegantes Rosa/Pink */
      color: #ffffff !important;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-rosa:hover {
      background-color: #d63031; /* Etwas dunklerer Ton beim Darüberfahren */
      transform: translateY(-2px);
    }

    .btn-rosa:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main class="thank-you-container">
    <div class="thank-you-card">
      <div class="thank-you-icon">✨</div>
      <h1>Vielen Dank für Ihre Anfrage!</h1>
      <p>
        Ihre Nachricht ist erfolgreich bei mir eingegangen. Ich werde mich so rasch wie möglich bei Ihnen melden.
      </p>
      <a href="index.html" class="btn-rosa">Zurück zur Startseite</a>
    </div>
  </main>

</body>
</html>
